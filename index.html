<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>jawieyの表白网站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#ff9a9e,#fad0c4);
       height:100vh;overflow:hidden;user-select:none}

  /* 表白页 */
  .main{display:flex;flex-direction:column;align-items:center;justify-content:center;
        height:100vh;color:#fff;text-align:center;padding:20px}
  .main h1{font-size:42px;margin-bottom:20px;text-shadow:0 0 20px #e91e63}
  .main p{font-size:18px;margin-bottom:40px;color:#fffde7}
  .love-btn{background:#e91e63;color:#fff;border:none;padding:16px 44px;
            font-size:20px;border-radius:40px;cursor:pointer;
            animation:pulse 2s infinite;font-weight:bold;
            box-shadow:0 6px 20px #e91e6388}
  .love-btn:hover{background:#ff4081;transform:scale(1.05)}
  @keyframes pulse{0%,100%{box-shadow:0 6px 20px #e91e6388}
                   50%{box-shadow:0 6px 40px #e91e63cc}}

  /* 蓝屏（心碎版） */
  .bsod{display:none;position:fixed;inset:0;background:#0b66c3;color:#fff;
        font-family:"Segoe UI",sans-serif;padding:40px 20px;z-index:9998;
        animation:flicker 8s infinite}
  .bsod .sad{font-size:80px;margin-bottom:20px}
  .bsod h2{font-size:22px;font-weight:400;margin-bottom:20px;line-height:1.4}
  .bsod .info{font-size:15px;line-height:1.8;margin-top:20px;opacity:.9}
  .bsod .highlight{color:#ffe600}
  .bsod .pct{margin-top:20px;font-size:15px}
  .bsod .progress-bar{width:80%;height:6px;background:#ffffff33;
                      border-radius:3px;margin:8px auto 0;overflow:hidden}
  .bsod .progress-fill{height:100%;width:0%;background:#ffe600;
                       transition:width .3s}
  .bsod .warning-msg{margin-top:30px;font-size:16px;color:#ffcdd2;
                     animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  @keyframes flicker{0%,95%,100%{opacity:1}96%{opacity:.92}97%{opacity:1}
                     98%{opacity:.95}99%{opacity:1}}

  /* 骂人页 */
  .rage{display:none;position:fixed;inset:0;background:#000;color:#ff1744;
        z-index:99999;flex-direction:column;justify-content:center;
        align-items:center;text-align:center;padding:30px;
        animation:shake .15s infinite}
  .rage h1{font-size:42px;margin-bottom:20px;text-shadow:0 0 30px #ff1744}
  .rage p{font-size:20px;line-height:1.6;max-width:90%;color:#ff6666}
  @keyframes shake{
    0%{transform:translate(1px,1px)}
    25%{transform:translate(-1px,0)}
    50%{transform:translate(1px,-1px)}
    75%{transform:translate(-1px,1px)}
    100%{transform:translate(0,1px)}
  }
</style>
</head>
<body>

<!-- 表白页 -->
<div class="main" id="main">
  <h1>💗 jawiey 的表白 💗</h1>
  <p>其实我憋了很久…<br>你愿意做我的人吗？</p>
  <button class="love-btn" onclick="activate()">
    ❤️ 点这里接受表白 ❤️
  </button>
  <p style="margin-top:40px;font-size:14px;color:#fff9c4">
    （手机用户：点完别想跑，会震的）
  </p>
</div>

<!-- 蓝屏 -->
<div class="bsod" id="bsod">
  <div class="sad">💔</div>
  <h2>你的心遇到问题，需要重新爱上 jawiey。</h2>
  <h2>我们正在收集你的后悔情绪…</h2>
  <div class="info">
    <span class="highlight">100%</span> 完成<br><br>
    错误类型：<span class="highlight">HEART_PROCESS_DIED</span><br>
    支持代码：<span class="highlight">JAWIEY-LOVE-666</span><br><br>
    如果你现在关闭网页，<br>
    系统将判定你 <b>“不爱 jawiey”</b>。
  </div>
  <div class="pct" id="pctText">正在收集后悔情绪... 0%</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="warning-msg" id="warningMsg" style="display:none">
    ⚠️ 系统已锁定，你跑不掉了。
  </div>
</div>

<!-- 骂人页 -->
<div class="rage" id="rage">
  <h1>💢 关网页 = 不爱我 💢</h1>
  <p>
    都已经点了“接受表白”。<br><br>
    现在还想跑？<br><br>
    负心的人，连网页都关不干净。<br><br>
    jawiey 记住你了。<br><br>
    😈 别装没看见。
  </p>
</div>

<script>
/* ===== 音频 + 震动 ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let humSource = null;
let isRaging = false;

function init(){
  if(!audioCtx) audioCtx = new AudioCtx();
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function vibrate(pattern){
  if(navigator.vibrate){
    navigator.vibrate(pattern);
  }
}

function playHum(){
  if(!audioCtx||humSource) return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='sawtooth';
  osc.frequency.value=60;
  gain.gain.value=0.08;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  humSource=osc;
}

function playZap(){
  if(!audioCtx||isRaging) return;
  isRaging=true;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(200,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.3);
  gain.gain.setValueAtTime(0.5,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+0.4);
}

/* ===== 交互 ===== */
function activate(){
  init();
  document.getElementById('main').style.display='none';
  const bs=document.getElementById('bsod');
  bs.style.display='block';
  playHum();
  vibrate([100,50,100]); // 手机震动：短-停-短

  let n=0;
  const pctText=document.getElementById('pctText');
  const fill=document.getElementById('progressFill');
  const warningMsg=document.getElementById('warningMsg');

  const t=setInterval(()=>{
    n+=Math.floor(Math.random()*7)+1;
    if(n>=100){n=100;clearInterval(t);
      pctText.textContent='已完成收集。 100%';
      warningMsg.style.display='block';
    }
    pctText.textContent='正在收集后悔情绪... '+n+'%';
    fill.style.width=n+'%';
  },180);
}

/* ===== 防退出 + 超强震动 ===== */
function triggerRage(){
  if(isRaging) return;
  isRaging=true;
  playZap();
  vibrate([500,100,500,100,500]); // 超强长震
  document.getElementById('rage').style.display='flex';
  if(humSource){humSource.stop();humSource=null;}
}

window.addEventListener('beforeunload',e=>{
  const bs=document.getElementById('bsod');
  if(bs.style.display==='block'){
    triggerRage();
    e.preventDefault();
    e.returnValue='';
  }
});

document.addEventListener('visibilitychange',()=>{
  const bs=document.getElementById('bsod');
  if(bs.style.display==='block'&&document.hidden){
    triggerRage();
    vibrate([200,100,200,100,200,100,200]); // 疯狂节奏震
  }
});

document.addEventListener('keydown',e=>{
  const bs=document.getElementById('bsod');
  if(bs.style.display==='block'){
    e.preventDefault();
    e.stopPropagation();
  }
});

document.getElementById('bsod').addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
});

document.addEventListener('contextmenu',e=>{
  const bs=document.getElementById('bsod');
  if(bs.style.display==='block'){
    e.preventDefault();
  }
});
</script>
</body>
</html>
