<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收到了一个祝福</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0a2e; }
  body { font-family: "Microsoft YaHei", sans-serif; }

  /* 爱心弹窗 */
  .pop {
    position: fixed; width: 130px; height: 56px;
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #333; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    animation: pop .3s ease; z-index: 9;
  }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* 满屏弹窗 */
  .full {
    position: fixed; width: 130px; height: 56px;
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #333; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    animation: pop .25s ease; z-index: 9;
  }

  /* 结局大字 */
  .final {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 99;
    background: radial-gradient(circle at center, #2a1052 0%, #0d0015 100%);
  }
  .final.show { display: flex; animation: fade 1s ease; }
  .final .heart { font-size: 80px; animation: beat 1s infinite; }
  .final .line { color: #ffd6e8; font-size: 26px; margin-top: 18px; letter-spacing: 4px; }
  .final .sub  { color: #c9a0c9; font-size: 16px; margin-top: 12px; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  @keyframes fade { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<div class="final" id="final">
  <div class="heart">❤️</div>
  <div class="line">中秋快乐</div>
  <div class="sub">点一下屏幕，让祝福开始</div>
</div>

<script>
const tips = ["多喝热水","好好爱自己","好好吃饭","保持好心情","我想你了","顺顺利利","别熬夜","天凉了多穿衣服"];
const colors = ["#FFC0CB","#ADD8E6","#90EE90","#FAFAD2","#FF69B4","#87CEFA"];
let started = false;

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

// 爱心参数方程，和 Python 版完全一致
function heart(n){
  const pts=[];
  for(let i=0;i<n;i++){
    const th = i/n*2*Math.PI;
    const x = 16*Math.pow(Math.sin(th),3);
    const y = 13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th);
    pts.push({x, y});
  }
  return pts;
}

function makeDiv(cls, text){
  const d = document.createElement('div');
  d.className = cls;
  const w = window.innerWidth, h = window.innerHeight;
  d.style.left = rand(0, w-130)+'px';
  d.style.top  = rand(0, h-56)+'px';
  d.style.background = colors[rand(0,colors.length-1)];
  d.textContent = text || tips[rand(0,tips.length-1)];
  document.body.appendChild(d);
  return d;
}

async function showHeart(){
  const w = window.innerWidth, h = window.innerHeight;
  const pts = heart(200);
  const pops = [];
  for(const p of pts){
    const sx = w/2 + p.x*16 - 65;
    const sy = h/2 - p.y*16 - 40;
    const d = document.createElement('div');
    d.className = 'pop';
    d.style.left = Math.max(0,Math.min(sx,w-130))+'px';
    d.style.top  = Math.max(0,Math.min(sy,h-56))+'px';
    d.style.background = colors[rand(0,colors.length-1)];
    d.textContent = tips[rand(0,tips.length-1)];
    document.body.appendChild(d);
    pops.push(d);
    await new Promise(r => setTimeout(r, 30));
  }
  await new Promise(r => setTimeout(r, 3000));
  pops.forEach(p => p.remove());
}

async function showFull(){
  const arr = [];
  for(let i=0;i<260;i++){
    arr.push(makeDiv('full'));
    await new Promise(r => setTimeout(r, 10));
  }
  await new Promise(r => setTimeout(r, 5000));
  arr.forEach(p => p.remove());
}

async function start(){
  if(started) return;
  started = true;
  document.getElementById('final').classList.remove('show');
  await showHeart();
  await showFull();
  document.getElementById('final').classList.add('show');
}

document.body.addEventListener('click', start);
document.body.addEventListener('touchstart', start);
</script>
</body>
</html>
