<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>阿强の神秘网站</title>
<style>
  body{margin:0;height:100vh;background:linear-gradient(135deg,#ff9a9e,#fad0c4);
       font-family:system-ui,sans-serif;overflow:hidden;cursor:crosshair}
  h1{text-align:center;margin-top:40px;color:#fff;text-shadow:2px 2px 0 #00000022}
  .bub{position:absolute;background:#fff;color:#1565c0;padding:6px 12px;
       border-radius:18px;box-shadow:0 4px 10px #0002;animation:fly 3s ease-out forwards;
       font-weight:bold;pointer-events:none}
  @keyframes fly{to{transform:translateY(-120vh);opacity:0}}
  .bsod{position:fixed;inset:0;background:#1f67b3;color:#fff;display:none;
        flex-direction:column;justify-content:center;align-items:center;font-size:24px}
</style>
</head>
<body>
<h1>点哪里都有惊喜 👆（别双击）</h1>
<div class="bsod" id="bsod">
  <div style="font-size:80px">:(</div>
  <p>你的电脑遇到一个搞笑问题，正在收集笑点…<span id="pct">0</span>%</p>
  <p style="font-size:14px;opacity:.8">（其实是假的，点一下就恢复）</p>
</div>
<script>
  const msgs=['你好呀！','666','太酷了','再点一个试试','阿强牛逼','别卷了'];
  document.body.addEventListener('click',e=>{
    if(document.getElementById('bsod').style.display==='flex')return;
    const b=document.createElement('div');
    b.className='bub';
    b.textContent=msgs[Math.random()*msgs.length|0];
    b.style.left=(e.clientX-30)+'px';
    b.style.top=e.clientY+'px';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),3000);
  });
  document.body.addEventListener('dblclick',()=>{
    const bs=document.getElementById('bsod');
    bs.style.display='flex';
    let n=0;
    const t=setInterval(()=>{
      n+=Math.floor(Math.random()*9)+1;
      if(n>=100){n=100;clearInterval(t);}
      document.getElementById('pct').textContent=n;
    },120);
  });
  document.getElementById('bsod').addEventListener('click',()=>{
    document.getElementById('bsod').style.display='none';
  });
</script>
</body>
</html>
