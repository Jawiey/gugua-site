<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>jawiey 刚发的群聊记录…</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:#0a0a0a;height:100vh;overflow:hidden;color:#fff;
       display:flex;flex-direction:column;align-items:center;
       justify-content:center;user-select:none}

  .cover{text-align:center;padding:20px;cursor:pointer;animation:fadeIn 1s ease-out}
  .cover .thumb{position:relative;width:min(90vw,420px);aspect-ratio:9/16;
    background:linear-gradient(135deg,#1a0000,#8b0000,#ff1744);
    border-radius:16px;margin:0 auto 20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 10px 40px #ff174455;overflow:hidden}

  .cover .badge{position:absolute;top:12px;left:12px;
    font-size:11px;background:#0008;padding:4px 8px;
    border-radius:10px;color:#ff5252;animation:blink 1s infinite}

  .cover .play-btn{width:70px;height:70px;background:#fff;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;color:#d32f2f;
    box-shadow:0 4px 20px #0008;animation:pulse 1.5s infinite}

  .cover .thumb p{margin-top:16px;font-size:14px;color:#ffcdd2}

  .cover h1{font-size:22px;margin-bottom:10px;color:#ff5252;
    text-shadow:0 0 15px #ff525255}

  .cover .sub{font-size:14px;color:#ff8a80;margin-bottom:8px}

  .cover .warn{font-size:12px;color:#ff8a80;max-width:320px;
    line-height:1.6;opacity:.85}

  @keyframes blink{0%,100%{opacity:.6}50%{opacity:1}}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 4px 20px #0008}
                   50%{transform:scale(1.12);box-shadow:0 0 30px #fff8}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}
                   to{opacity:1;transform:translateY(0)}}

  .player{display:none;position:fixed;inset:0;background:#000;
         z-index:9999;flex-direction:column;align-items:center;
         justify-content:center}
  .player video{width:100%;height:100%;object-fit:contain;background:#000}
  .player .credit{position:absolute;bottom:20px;left:0;width:100%;
         text-align:center;color:#fff8;font-size:14px;
         text-shadow:0 1px 4px #000;animation:blink 2s infinite}
  .player .credit b{color:#e91e63}

  .reveal{display:none;position:fixed;inset:0;background:#0a0a0a;
         z-index:10000;flex-direction:column;align-items:center;
         justify-content:center;text-align:center;padding:30px;
         animation:fadeIn .8s}
  .reveal h1{font-size:38px;color:#ffeb3b;margin-bottom:16px;
         text-shadow:0 0 30px #ffeb3b55}
  .reveal p{font-size:18px;color:#fff;line-height:2}
  .reveal .emoji{font-size:60px;margin-bottom:16px;animation:bounce 1s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}
                   50%{transform:translateY(-12px)}}
</style>
</head>

<body>

<!-- ✅ 新封面（高诱惑、与视频无关） -->
<div class="cover" id="cover" onclick="start()">
  <div class="thumb">
    <div class="badge">🔒 仅你可见</div>
    <div class="play-btn">👀</div>
    <p>群聊记录 · 已撤回</p>
  </div>

  <h1>jawiey 刚发的群聊记录…</h1>
  <div class="sub">⚠️ 点开前请确认身边没人</div>
  <div class="warn">此内容已被 3 人举报，继续查看视为自愿承担后果</div>
</div>

<!-- 播放器 -->
<div class="player" id="player">
  <video id="vid" playsinline webkit-playsinline preload="auto">
    <source src="Video(1).mp4" type="video/mp4">
    你的浏览器不支持视频播放。
  </video>
  <div class="credit">🎵 正在为你播放 <b>Never Gonna Give You Up</b> · jawiey 出品 😈</div>
</div>

<!-- 结束揭晓 -->
<div class="reveal" id="reveal">
  <div class="emoji">🎉</div>
  <h1>你被 jawiey Rickroll 了！</h1>
  <p>
    经典永不过时 🎵<br>
    Never gonna give you up~<br>
    Never gonna let you down~<br><br>
    下次还敢点 jawiey 的链接吗？😈<br>
    —— jawiey
  </p>
</div>

<script>
function start(){
  const cover=document.getElementById('cover');
  const player=document.getElementById('player');
  const vid=document.getElementById('vid');

  cover.style.display='none';
  player.style.display='flex';

  const docEl=document.documentElement;
  const reqFs=docEl.requestFullscreen||docEl.webkitRequestFullscreen
            ||docEl.mozRequestFullScreen||docEl.msRequestFullscreen;
  if(reqFs){try{reqFs.call(docEl);}catch(e){}}

  vid.muted=false;
  const p=vid.play();
  if(p&&p.catch){p.catch(()=>{vid.muted=true;vid.play();});}
}

document.getElementById('vid').addEventListener('ended',()=>{
  document.getElementById('player').style.display='none';
  document.getElementById('reveal').style.display='flex';
});

window.addEventListener('beforeunload',e=>{
  const player=document.getElementById('player');
  if(player.style.display==='flex'){
    e.preventDefault();
    e.returnValue='';
  }
});
</script>

</body>
</html>
