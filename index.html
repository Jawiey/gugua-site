<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>jawieyの表白网站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#ff9a9e,#fad0c4);
       height:100vh;overflow:hidden;user-select:none}

  .main{display:flex;flex-direction:column;align-items:center;justify-content:center;
        height:100vh;color:#fff;text-align:center;padding:20px;z-index:1;position:relative}
  .main h1{font-size:42px;margin-bottom:20px;text-shadow:0 0 20px #e91e63}
  .main p{font-size:18px;margin-bottom:30px;color:#fffde7}
  .love-btn{background:#e91e63;color:#fff;border:none;padding:16px 44px;
            font-size:20px;border-radius:40px;cursor:pointer;
            animation:pulse 2s infinite;font-weight:bold;
            box-shadow:0 6px 20px #e91e6388}
  .love-btn:hover{background:#ff4081;transform:scale(1.05)}
  @keyframes pulse{0%,100%{box-shadow:0 6px 20px #e91e6388}
                   50%{box-shadow:0 6px 40px #e91e63cc}}

  /* 弹窗样式 */
  .popup{position:fixed;background:#fff;border:2px solid #e91e63;
         box-shadow:4px 4px 15px #0005;z-index:9999;
         min-width:200px;max-width:350px;
         animation:popIn .2s ease-out}
  .popup .title{background:#e91e63;color:#fff;padding:6px 10px;
                font-size:13px;font-weight:bold;
                display:flex;justify-content:space-between}
  .popup .body{padding:15px;font-size:14px;color:#333;line-height:1.5}
  .popup .btns{text-align:right;padding:8px 15px;border-top:1px solid #eee}
  .popup button{background:#e91e63;color:#fff;border:none;
                padding:5px 18px;font-size:13px;border-radius:3px;
                cursor:pointer}
  .popup button:hover{background:#ff4081}
  @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

  /* 蓝屏 */
  .bsod{display:none;position:fixed;inset:0;background:#0b66c3;color:#fff;
        font-family:"Segoe UI",sans-serif;padding:40px 20px;z-index:8888;
        animation:flicker 8s infinite}
  .bsod .sad{font-size:80px;margin-bottom:20px}
  .bsod h2{font-size:22px;font-weight:400;margin-bottom:20px}
  .bsod .info{font-size:15px;line-height:1.8}
  .bsod .highlight{color:#ffe600}
  @keyframes flicker{0%,95%,100%{opacity:1}96%{opacity:.92}97%{opacity:1}
                     98%{opacity:.95}99%{opacity:1}}

  /* 骂人页 */
  .rage{display:none;position:fixed;inset:0;background:#000;color:#ff1744;
        z-index:99999;flex-direction:column;justify-content:center;
        align-items:center;text-align:center;padding:30px;
        animation:shake .15s infinite}
  .rage h1{font-size:42px;margin-bottom:20px}
  .rage p{font-size:20px;line-height:1.6;color:#ff6666}
  @keyframes shake{
    0%{transform:translate(1px,1px)}
    25%{transform:translate(-1px,0)}
    50%{transform:translate(1px,-1px)}
    75%{transform:translate(-1px,1px)}
    100%{transform:translate(0,1px)}
  }
</style>
</head>
<body>

<div class="main" id="main">
  <h1>💗 jawiey 的表白 💗</h1>
  <p>你愿意做我的人吗？</p>
  <button class="love-btn" onclick="activate()">
    ❤️ 点这里接受表白 ❤️
  </button>
</div>

<div class="bsod" id="bsod">
  <div class="sad">💔</div>
  <h2>你的心遇到问题，需要重新爱上 jawiey。</h2>
  <div class="info">
    错误类型：<span class="highlight">HEART_PROCESS_DIED</span><br>
    支持代码：<span class="highlight">JAWIEY-LOVE-666</span><br><br>
    系统已锁定。<br>
    关闭按钮已被弹窗淹没。
  </div>
</div>

<div class="rage" id="rage">
  <h1>💢 关不掉吧？💢</h1>
  <p>
    弹窗海战术启动。<br><br>
    关闭按钮已经不存在了。<br><br>
    jawiey 赢了。
  </p>
</div>

<script>
const messages = [
  "⚠️ 系统检测到你想逃跑",
  "💔 jawiey 很伤心",
  "😈 你跑不掉了",
  "📢 关闭按钮已被淹没",
  "💗 承认错误就能解脱",
  "🔒 系统已锁定",
  "⚡ 不听劝是吧？",
  "📳 手机在震对吧？",
  "🖥️ 电脑也卡了吧？",
  "💀 这就是代价",
  "📌 你每关一个，我弹两个",
  "🫠 累了吗？承认吧",
  "📡 已上报 jawiey",
  "🚫 此网页不允许关闭",
  "💢 负心的人没有好下场",
  "📵 请勿试图离开",
  "🦇 暗影弹窗已部署",
  "🕳️ 你越挣扎陷越深",
  "🪤 你中了 jawiey 的陷阱",
  "🫶 爱 jawiey 是唯一出路"
];

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let isRaging = false;
let popupCount = 0;

function init(){
  if(!audioCtx) audioCtx = new AudioCtx();
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function vibrate(p){
  if(navigator.vibrate) navigator.vibrate(p);
}

function playZap(){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(200,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.3);
  gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+0.4);
}

/* 创建单个弹窗 */
function createPopup(text, x, y){
  const popup=document.createElement('div');
  popup.className='popup';
  popup.style.left=Math.min(x,window.innerWidth-250)+'px';
  popup.style.top=Math.min(y,window.innerHeight-150)+'px';
  popup.innerHTML=`
    <div class="title"><span>jawiey 的系统</span><span>⚠️</span></div>
    <div class="body">${text}</div>
    <div class="btns"><button onclick="onPopupClick(event)">确定</button></div>
  `;
  document.body.appendChild(popup);
  popupCount++;
  return popup;
}

/* 点弹窗的确定 → 关掉这个，再弹2个新的 */
function onPopupClick(e){
  e.stopPropagation();
  const popup=e.target.closest('.popup');
  if(popup) popup.remove();
  popupCount--;
  // 弹2个新的
  for(let i=0;i<2;i++){
    const x=Math.random()*(window.innerWidth-200);
    const y=Math.random()*(window.innerHeight-120);
    const msg=messages[Math.floor(Math.random()*messages.length)];
    createPopup(msg,x,y);
  }
  playZap();
  vibrate([100,50,100]);
}

/* 满屏弹窗轰炸 */
function spamPopups(){
  // 先铺 20 个
  for(let i=0;i<20;i++){
    const x=Math.random()*window.innerWidth;
    const y=Math.random()*window.innerHeight;
    const msg=messages[Math.floor(Math.random()*messages.length)];
    createPopup(msg,x,y);
  }
  // 然后每 800ms 再补 5 个，保持满屏
  setInterval(()=>{
    for(let i=0;i<5;i++){
      const x=Math.random()*window.innerWidth;
      const y=Math.random()*window.innerHeight;
      const msg=messages[Math.floor(Math.random()*messages.length)];
      createPopup(msg,x,y);
    }
  },800);
}

/* 激活 */
function activate(){
  init();
  document.getElementById('main').style.display='none';
  document.getElementById('bsod').style.display='block';
  vibrate([200,100,200]);
  // 1.5秒后开始弹窗轰炸
  setTimeout(()=>{
    spamPopups();
  },1500);
}

/* 终极防退出 */
function triggerRage(){
  if(isRaging) return;
  isRaging=true;
  playZap();
  vibrate([500,100,500,100,500]);
  document.getElementById('rage').style.display='flex';
}

window.addEventListener('beforeunload',e=>{
  triggerRage();
  e.preventDefault();
  e.returnValue='';
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden) triggerRage();
});

document.addEventListener('keydown',e=>{
  e.preventDefault();
  e.stopPropagation();
});

document.addEventListener('contextmenu',e=>{
  e.preventDefault();
});
</script>
</body>
</html>
