<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>收到了一个祝福</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%;
    height:100%;
    height:100dvh;
    overflow:hidden;
    background:#1a0b2e;
    font-family:"微软雅黑", sans-serif;
  }
  body { -webkit-tap-highlight-color: transparent; }

  #stage {
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    height:100dvh;
    overflow:hidden;
    pointer-events:none;
  }

  .pop, .full {
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:12px;
    color:#333;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    z-index:10;
    animation:fade .3s ease-out;
  }
  .full { border-radius:10px; animation:fade .2s ease-out; z-index:20; }

  .final {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#1a0b2e;
    z-index:100;
    opacity:0;
    pointer-events:none;
  }
  .final.show { opacity:1; pointer-events:auto; transition:opacity 1s; }

  .heart { font-size:80px; animation:beat 1s infinite; }
  .line { font-size:32px; color:#fff; margin-top:15px; letter-spacing:4px; }
  .sub  { font-size:16px; color:#ff69b4; margin-top:10px; opacity:0.8; }

  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  @keyframes fade { from{opacity:0; transform:scale(.5)} to{opacity:1; transform:scale(1)} }
</style>
</head>
<body>

<div id="stage"></div>

<div class="final" id="final">
  <div class="heart">❤️</div>
  <div class="line">祝福已送达</div>
  <div class="sub">点击屏幕可重新开始</div>
</div>

<script>
const tips = ["多喝热水","好好爱自己","好好吃饭","保持好心情","我想你了","顺顺利利","别熬夜","天凉了多穿衣服"];
const colors = ["#FFC0CB","#ADD8E6","#90EE90","#FAFAD2","#FF69B4","#87CEFA"];
const stage = document.getElementById('stage');
const finalLayer = document.getElementById('final');
let running = false;

function rand(a,b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function viewportSize() {
  if (window.visualViewport) {
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}

function heart(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const th = i / n * 2 * Math.PI;
    const x = 16 * Math.pow(Math.sin(th), 3);
    const y = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
    pts.push({x, y});
  }
  return pts;
}

function makePop(cls, text, x, y, w, h) {
  const d = document.createElement('div');
  d.className = cls;
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  d.style.width = w + 'px';
  d.style.height = h + 'px';
  d.style.background = colors[rand(0, colors.length - 1)];
  d.textContent = text || tips[rand(0, tips.length - 1)];
  stage.appendChild(d);
  return d;
}

async function showHeart() {
  const { w, h } = viewportSize();
  const safeTop = 0, safeBottom = 0;
  const usableH = h - safeTop - safeBottom;

  const pw = Math.min(110, w * 0.26);
  const ph = Math.round(pw * 0.45);

  const heartSize = Math.min(w, usableH) * 0.75;
  const unit = heartSize / 32;

  const cx = w / 2;
  const cy = usableH / 2;

  const pts = heart(200);
  const pops = [];

  for (const p of pts) {
    const px = cx + p.x * unit - pw / 2;
    const py = cy - p.y * unit - ph / 2;
    const d = makePop('pop', null, px, py, pw, ph);
    pops.push(d);
    await new Promise(r => setTimeout(r, 60)); // 爱心生成速度，越大越慢
  }

  await new Promise(r => setTimeout(r, 3000));
  pops.forEach(p => p.remove());
}

async function showFull() {
  const { w, h } = viewportSize();
  const usableW = w;
  const usableH = h;

  const pw = Math.min(90, w * 0.22);
  const ph = Math.round(pw * 0.45);

  const count = w < 600 ? 100 : 250;
  const arr = [];

  for (let i = 0; i < count; i++) {
    const px = Math.random() * (usableW - pw);
    const py = Math.random() * (usableH - ph);
    const d = makePop('full', null, px, py, pw, ph);
    arr.push(d);
    await new Promise(r => setTimeout(r, 25)); // 满屏弹窗生成速度
  }

  await new Promise(r => setTimeout(r, 5000));
  arr.forEach(p => p.remove());
}

async function start() {
  if (running) return;
  running = true;
  finalLayer.classList.remove('show');
  stage.innerHTML = '';

  await showHeart();
  await showFull();

  finalLayer.classList.add('show');
  running = false;
}

window.addEventListener('load', () => setTimeout(start, 600));
finalLayer.addEventListener('click', start);
finalLayer.addEventListener('touchstart', start);
</script>
</body>
</html>
