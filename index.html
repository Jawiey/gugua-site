<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>jawieyの表白网站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#ff9a9e,#fad0c4);
       height:100vh;overflow:hidden;user-select:none}

  .main{display:flex;flex-direction:column;align-items:center;justify-content:center;
        height:100vh;color:#fff;text-align:center;padding:20px}
  .main h1{font-size:42px;margin-bottom:20px;text-shadow:0 0 20px #e91e63}
  .main p{font-size:18px;margin-bottom:30px;color:#fffde7}

  .fake-close{
    background:#333;color:#fff;border:none;padding:12px 30px;
    font-size:16px;border-radius:6px;cursor:pointer;
    margin-top:20px;animation:glow 1.5s infinite alternate
  }
  .fake-close:hover{background:#000}
  @keyframes glow{
    from{box-shadow:0 0 10px #ff1744}
    to{box-shadow:0 0 25px #ff1744}
  }

  .bsod{display:none;position:fixed;inset:0;background:#0b66c3;color:#fff;
        font-family:"Segoe UI",sans-serif;padding:40px 20px;z-index:9998}
  .bsod .sad{font-size:80px;margin-bottom:20px}
  .bsod h2{font-size:22px;font-weight:400;margin-bottom:20px}
  .bsod .info{font-size:15px;line-height:1.8}
  .bsod .highlight{color:#ffe600}

  .rage{display:none;position:fixed;inset:0;background:#000;color:#ff1744;
        z-index:99999;flex-direction:column;justify-content:center;
        align-items:center;text-align:center;padding:30px;
        animation:shake .15s infinite}
  .rage h1{font-size:42px;margin-bottom:20px}
  .rage p{font-size:20px;line-height:1.6;color:#ff6666}
  @keyframes shake{
    0%{transform:translate(1px,1px)}
    25%{transform:translate(-1px,0)}
    50%{transform:translate(1px,-1px)}
    75%{transform:translate(-1px,1px)}
    100%{transform:translate(0,1px)}
  }
</style>
</head>
<body>

<div class="main" id="main">
  <h1>💗 jawiey 的表白 💗</h1>
  <p>点下面这个按钮，可以“安全关闭”哦～</p>

  <!-- 假关闭按钮 -->
  <button class="fake-close" onclick="trapClose()">
    ❌ 关闭网页
  </button>

  <p style="margin-top:40px;font-size:14px;color:#fff9c4">
    （真的可以关，不信你试试）
  </p>
</div>

<div class="bsod" id="bsod">
  <div class="sad">💔</div>
  <h2>你刚刚点了“关闭”。</h2>
  <div class="info">
    系统判定你 <span class="highlight">不爱 jawiey</span>。<br><br>
    正在收集你的后悔情绪…<br><br>
    支持代码：<span class="highlight">JAWIEY-CLOSE-TRAP-666</span>
  </div>
</div>

<div class="rage" id="rage">
  <h1>💢 你居然真敢点关闭 💢</h1>
  <p>
    我都这么用心了，你还要跑？<br><br>
    现在你已经被 jawiey 的<br>
    <b>“真爱干扰系统”</b> 锁定。<br><br>
    关不掉，退不了，<br>
    只能乖乖承认错误。
  </p>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let isRaging = false;

function init(){
  if(!audioCtx) audioCtx = new AudioCtx();
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function vibrate(p){
  if(navigator.vibrate) navigator.vibrate(p);
}

function playZap(){
  if(!audioCtx||isRaging) return;
  isRaging=true;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(200,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.3);
  gain.gain.setValueAtTime(0.5,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+0.4);
}

/* 假关闭按钮陷阱 */
function trapClose(){
  init();
  document.getElementById('main').style.display='none';
  document.getElementById('bsod').style.display='block';
  vibrate([200,100,200]);
}

/* 真关闭干扰 */
function triggerRage(){
  if(isRaging) return;
  isRaging=true;
  playZap();
  vibrate([500,100,500,100,500]);
  document.getElementById('rage').style.display='flex';
}

/* 点 × / 切后台 */
window.addEventListener('beforeunload',e=>{
  triggerRage();
  e.preventDefault();
  e.returnValue='';
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    triggerRage();
  }
});

/* PC：鼠标靠近顶部 = 干扰 */
document.addEventListener('mousemove',e=>{
  if(e.clientY < 40){
    triggerRage();
  }
});
</script>
</body>
</html>
